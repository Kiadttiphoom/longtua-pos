<!-- POS Terminal Tab (Impeccable Layout) -->
<div id="tab-pos" class="tab-pane">
  <div class="pos-container">
    
    <!-- Left Column: Product Catalog & Search -->
    <div class="card" style="margin-bottom: 0;">
      <div class="card-header">
        <div>
          <h3>รายการสินค้าหน้าร้าน (Catalog)</h3>
          <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem;">เลือกสินค้าเพื่อเพิ่มลงตะกร้าหรือพิมพ์ค้นหา</p>
        </div>
        <div style="display: flex; gap: 0.6rem; align-items: center;">
          <input type="text" id="posSearchInput" placeholder="ค้นหาชื่อสินค้า หรือ SKU..." oninput="filterPosProducts()" style="padding: 0.45rem 0.85rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 0.85rem; width: 220px; background:#ffffff;">
          <button class="btn-refresh" onclick="loadProductsForPos()" title="ดึงข้อมูลสินค้าล่าสุด">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span>รีเฟรช</span>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div id="posProductGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.15rem;">
          <!-- POS items will appear here -->
        </div>
      </div>
    </div>

    <!-- Right Column: Cart & Summary Sticky Sidebar -->
    <div class="card" style="margin-bottom: 0; position: sticky; top: 0;">
      <div class="card-header" style="background:#f8fafc;">
        <div>
          <h3>ตะกร้าสินค้า (Cart)</h3>
          <span style="font-size: 0.78rem; color: var(--text-secondary);" id="posCartItemCount">0 รายการ</span>
        </div>
        <button class="btn-action-sm btn-action-danger" onclick="clearPosCart()" style="font-size: 0.75rem;">ล้างตะกร้า</button>
      </div>

      <div class="card-body" style="padding: 1rem; max-height: calc(100vh - 340px); overflow-y: auto;" id="posCartList">
        <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin: 0 auto 0.75rem; color: #cbd5e1;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <div style="font-size: 0.88rem; font-weight: 500;">ยังไม่มีสินค้าในตะกร้า</div>
          <div style="font-size: 0.78rem; margin-top: 0.25rem;">คลิกที่สินค้าเพื่อเลือกซื้อ</div>
        </div>
      </div>

      <!-- Checkout Summary Box -->
      <div style="padding: 1.25rem; background: #f8fafc; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.6rem;">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary);">
          <span>ยอดรวมสินค้า</span>
          <span id="posSubtotal" style="font-weight: 600; color: var(--text-primary);">฿0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary);">
          <span>ภาษีมูลค่าเพิ่ม (VAT 7%)</span>
          <span id="posVatAmount">฿0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; color: var(--primary); padding-top: 0.5rem; border-top: 1px dashed #cbd5e1;">
          <span>ยอดสุทธิ</span>
          <span id="posGrandTotal">฿0.00</span>
        </div>
        <button class="btn-primary" onclick="checkoutPosOrder()" style="margin-top: 0.5rem; width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem; border-radius: var(--radius-sm);">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span>รับชำระเงิน (Checkout)</span>
        </button>
      </div>

    </div>

  </div>
</div>
