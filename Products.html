<!-- Products Tab -->
<div id="tab-products" class="tab-pane">
  <div class="card">
    <div class="card-header">
      <div>
        <h3>จัดการสินค้าและสต็อก (Products)</h3>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem;">เพิ่ม แก้ไขสินค้า พร้อมระบบจัดการรูปภาพบน Google Drive</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn-refresh" onclick="loadProductsData()">
          <span>รีเฟรชสินค้า</span>
        </button>
        <button class="btn-primary" onclick="openProductModal()">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          <span>เพิ่มสินค้าใหม่</span>
        </button>
      </div>
    </div>
    <div class="card-body" style="padding: 0;">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 60px;">รูปภาพ</th>
              <th>รหัส/SKU</th>
              <th>ชื่อสินค้า</th>
              <th>หมวดหมู่</th>
              <th>ราคาขาย</th>
              <th>คงเหลือ</th>
              <th>สถานะ</th>
              <th style="text-align: right; width: 140px;">จัดการ</th>
            </tr>
          </thead>
          <tbody id="productsFullTableBody">
            <tr>
              <td colspan="8" style="text-align: center; padding: 2rem; color: #94a3b8;">
                กดปุ่ม "รีเฟรชสินค้า" เพื่อดึงข้อมูลจริงจาก Google Sheets
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
