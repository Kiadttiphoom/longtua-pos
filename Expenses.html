<!-- Expenses Tab -->
<div id="tab-expenses" class="tab-pane">
  <div class="card">
    <div class="card-header">
      <div>
        <h3>บันทึกรายจ่ายร้านค้า (Expenses Sheet)</h3>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem;">ข้อมูลค่าใช้จ่ายและต้นทุนดำเนินการจาก Google Sheets</p>
      </div>
      <button class="btn-refresh" onclick="loadExpensesData()">
        <span>โหลดรายการรายจ่าย</span>
      </button>
    </div>
    <div class="card-body" style="padding: 0;">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID/วันที่</th>
              <th>ประเภทค่าใช้จ่าย</th>
              <th>รายละเอียด</th>
              <th>จำนวนเงิน</th>
              <th>ผู้บันทึก</th>
            </tr>
          </thead>
          <tbody id="expensesFullTableBody">
            <tr>
              <td colspan="5" style="text-align: center; padding: 2rem; color: #94a3b8;">
                กดปุ่ม "โหลดรายการรายจ่าย" เพื่อดึงข้อมูลจริงจาก Google Sheets
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
