<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

  :root {
    /* Color Palette - Refined Slate & Indigo Theme */
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #eef2ff;
    --primary-border: #c7d2fe;
    
    --success: #10b981;
    --success-light: #ecfdf5;
    --success-border: #a7f3d0;
    --success-text: #065f46;

    --warning: #f59e0b;
    --warning-light: #fffbeb;
    --warning-border: #fde68a;
    --warning-text: #92400e;

    --danger: #ef4444;
    --danger-light: #fef2f2;
    --danger-border: #fecaca;
    --danger-text: #991b1b;

    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --border-light: #f1f5f9;

    --sidebar-width: 260px;
    --header-height: 64px;

    /* Elevation & Craft Depth */
    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
    --shadow-modal: 0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);

    /* Spacing & Radii (4-unit rhythm) */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
  }

  /* Reset & Typography */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Browser Surface Theming (Craft Floor requirement) */
  ::selection {
    background-color: var(--primary-light);
    color: var(--primary);
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: var(--radius-full);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Layout Container */
  .app-container {
    display: flex;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  aside.sidebar {
    width: var(--sidebar-width);
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 40;
    border-right: 1px solid #1e293b;
  }

  .sidebar-brand {
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 1.25rem;
    gap: 0.85rem;
    border-bottom: 1px solid #1e293b;
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 1.1rem;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    overflow: hidden;
    flex-shrink: 0;
  }

  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-info {
    overflow: hidden;
  }

  .brand-info h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-info span {
    font-size: 0.72rem;
    color: #94a3b8;
    display: block;
    margin-top: 1px;
  }

  .sidebar-menu {
    flex: 1;
    padding: 1rem 0.75rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .menu-heading {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    padding: 0.85rem 0.75rem 0.35rem 0.75rem;
    font-weight: 600;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.7rem 0.9rem;
    border-radius: var(--radius-sm);
    color: #94a3b8;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .nav-item:hover {
    background-color: #1e293b;
    color: #ffffff;
  }

  .nav-item.active {
    background-color: var(--primary);
    color: #ffffff;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
  }

  .nav-item svg {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
  }

  .btn-collapse-sidebar {
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 0.35rem;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .btn-collapse-sidebar:hover {
    background: #1e293b;
    color: #ffffff;
  }

  /* Collapsed Sidebar State (Desktop) */
  aside.sidebar.collapsed {
    width: 72px;
  }

  aside.sidebar.collapsed .sidebar-brand {
    padding: 0;
    justify-content: center;
  }

  aside.sidebar.collapsed .brand-info,
  aside.sidebar.collapsed .menu-heading,
  aside.sidebar.collapsed .nav-item span,
  aside.sidebar.collapsed .user-details {
    display: none !important;
  }

  aside.sidebar.collapsed .btn-collapse-sidebar {
    display: none;
  }

  aside.sidebar.collapsed .brand-logo {
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  aside.sidebar.collapsed .brand-logo:hover {
    transform: scale(1.08);
  }

  aside.sidebar.collapsed .nav-item {
    justify-content: center;
    padding: 0.75rem 0;
    border-radius: var(--radius-sm);
    position: relative;
  }

  aside.sidebar.collapsed .nav-item svg {
    margin: 0;
    width: 20px;
    height: 20px;
  }

  aside.sidebar.collapsed .sidebar-footer {
    justify-content: center;
    padding: 0.85rem 0;
  }

  aside.sidebar.collapsed .user-avatar {
    margin: 0;
  }

  /* Main Wrapper */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-main);
  }

  /* Header */
  header.top-header {
    height: var(--header-height);
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    flex-shrink: 0;
    z-index: 30;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .btn-toggle-sidebar {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }

  .btn-toggle-sidebar:hover {
    background-color: var(--border-light);
    color: var(--text-primary);
  }

  .page-title-box h2 {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.25;
  }

  .page-title-box p {
    font-size: 0.78rem;
    color: var(--text-secondary);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .badge-sheet-status {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.35rem 0.8rem;
    background-color: var(--success-light);
    color: var(--success-text);
    border: 1px solid var(--success-border);
    border-radius: var(--radius-full);
    font-size: 0.78rem;
    font-weight: 500;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  /* Buttons */
  .btn-refresh {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: #ffffff;
    border: 1px solid var(--border-color);
    padding: 0.45rem 0.95rem;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-refresh:hover {
    background-color: #f8fafc;
    border-color: #cbd5e1;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 0.5rem 1.15rem;
    border-radius: var(--radius-sm);
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 1px 3px rgba(79, 70, 229, 0.2);
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    box-shadow: 0 3px 6px rgba(79, 70, 229, 0.3);
  }

  button:disabled,
  .btn-primary:disabled,
  .btn-refresh:disabled,
  .btn-action-sm:disabled {
    opacity: 0.45 !important;
    cursor: not-allowed !important;
    pointer-events: none !important;
    filter: grayscale(40%) !important;
  }

  .btn-action-sm {
    padding: 0.35rem 0.75rem;
    font-size: 0.78rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    background: #ffffff;
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 500;
    color: var(--text-primary);
  }

  .btn-action-sm:hover {
    background: #f1f5f9;
  }

  .btn-action-danger {
    color: var(--danger);
    border-color: var(--danger-border);
    background: var(--danger-light);
  }

  .btn-action-danger:hover {
    background: #fee2e2;
  }

  /* Content Body */
  main.content-area {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
  }

  .tab-pane {
    display: none;
    animation: fadeIn 0.25s ease-out;
  }

  .tab-pane.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card Component */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .card-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
  }

  .card-header h3 {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .card-body {
    padding: 1.5rem;
  }

  /* Metric Stat Cards - Impeccable Clean Rhythm */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.75rem;
  }

  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 1.35rem 1.5rem;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 130px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .stat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stat-title {
    font-size: 0.82rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-card.sales .stat-icon { background: var(--primary-light); color: var(--primary); }
  .stat-card.profit .stat-icon { background: var(--success-light); color: var(--success); }
  .stat-card.expenses .stat-icon { background: var(--danger-light); color: var(--danger); }
  .stat-card.orders .stat-icon { background: #e0f2fe; color: #0284c7; }

  .stat-value {
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
    margin-top: 0.5rem;
    letter-spacing: -0.02em;
  }

  .stat-meta {
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 0.4rem;
  }

  /* Two Column Layout */
  .grid-2-cols {
    display: grid;
    grid-template-columns: 2fr 1.1fr;
    gap: 1.5rem;
    margin-bottom: 1.75rem;
  }

  @media (max-width: 1024px) {
    .grid-2-cols {
      grid-template-columns: 1fr;
    }
  }

  /* POS Layout Structure */
  .pos-container {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 1100px) {
    .pos-container {
      grid-template-columns: 1fr;
    }
  }

  .pos-card {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: #ffffff;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
  }

  .pos-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary);
  }

  .pos-card-img {
    width: 100%;
    height: 130px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    overflow: hidden;
    position: relative;
  }

  .pos-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }

  .pos-card:hover .pos-card-img img {
    transform: scale(1.05);
  }

  .pos-card-body {
    padding: 0.85rem 1rem;
    display: flex;
    flex-direction: column;
    flex: 1;
    justify-content: space-between;
  }

  /* Tables */
  .table-responsive {
    overflow-x: auto;
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.88rem;
  }

  table.data-table th {
    background: #f8fafc;
    padding: 0.85rem 1.15rem;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  table.data-table td {
    padding: 0.95rem 1.15rem;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
    vertical-align: middle;
  }

  table.data-table tr:hover td {
    background-color: #f8fafc;
  }

  /* Status Badges */
  .badge-status {
    display: inline-block;
    padding: 0.25rem 0.6rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 500;
  }

  .badge-status.success {
    background: var(--success-light);
    color: var(--success-text);
    border: 1px solid var(--success-border);
  }

  .badge-status.warning {
    background: var(--warning-light);
    color: var(--warning-text);
    border: 1px solid var(--warning-border);
  }

  .badge-status.danger {
    background: var(--danger-light);
    color: var(--danger-text);
    border: 1px solid var(--danger-border);
  }

  /* Product Thumbnail */
  .product-thumbnail {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    background: #f1f5f9;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    overflow: hidden;
    flex-shrink: 0;
  }

  .product-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Image Dropzone & Preview */
  .image-dropzone {
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius-md);
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    background: #f8fafc;
    transition: all 0.2s ease;
  }

  .image-dropzone:hover, .image-dropzone.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .image-preview-container {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border-color);
    background: #ffffff;
    box-shadow: var(--shadow-sm);
  }

  .image-preview-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Sheets 9 Grid */
  .sheets-overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 1rem;
  }

  .sheet-badge-card {
    padding: 1.15rem;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: #ffffff;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .sheet-badge-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }

  .sheet-badge-name {
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--text-primary);
    margin-bottom: 0.35rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sheet-badge-rows {
    font-size: 0.78rem;
    color: var(--text-secondary);
  }

  /* Toast Notification */
  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 9999;
    pointer-events: none;
  }

  .toast {
    padding: 0.85rem 1.25rem;
    border-radius: var(--radius-md);
    background: #0f172a;
    color: #ffffff;
    font-size: 0.88rem;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 0.65rem;
    pointer-events: auto;
    animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .toast.success { background: #064e3b; border-left: 4px solid var(--success); }
  .toast.error { background: #7f1d1d; border-left: 4px solid var(--danger); }
  .toast.warning { background: #78350f; border-left: 4px solid var(--warning); }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Progress Bar */
  .progress-bar-container {
    width: 100%;
    height: 5px;
    background: #e2e8f0;
    border-radius: var(--radius-full);
    overflow: hidden;
    margin-top: 0.5rem;
    display: none;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.3s ease;
  }

  /* Spinner */
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Form Elements */
  input[type="text"], input[type="number"], select, textarea {
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12) !important;
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
    aside.sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: -100%;
    }

    aside.sidebar.mobile-open {
      left: 0;
    }

    .btn-toggle-sidebar {
      display: block;
    }

    header.top-header {
      padding: 0 1rem;
    }

    main.content-area {
      padding: 1rem;
    }

    .stats-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
